<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t" font-family="'Avenir Next','Helvetica Neue',Arial,sans-serif">
  <title id="t">Example performance dashboard with headline numbers and a sales chart that marks each shipped change</title>
  <rect width="1200" height="760" rx="14" fill="#0d131c"/>
